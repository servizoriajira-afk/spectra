/* ---- employee eNPS ---- */
const PULSE = ["Хватает времени на клиента","Знаю стандарт и обучен","Удобные инструменты (касса, CRM)","Руководитель помогает","Понятна мотивация"];
const ENPS = S.map((s,i) => { const r = rng(700+i); const e = Math.round(clamp(s.qrNps*.6 + (s.format==="Франшиза"?-12:0) + (r()-.5)*22, -40, 75)); return {s, e, n:6+Math.floor(r()*18), items:PULSE.map(()=>clamp(3+(e/50)+(r()-.5)*1.2,1.5,4.9))}; });
P.enps = () => {
  const a = ENPS.filter(x=>inScope(x.s));
  const W=640, H=300, L=44, Rr=16, T=14, B=36;
  const x = v => L + (v+50)/130*(W-L-Rr), y = v => T + (1-(v+40)/130)*(H-T-B);
  let g = ""; for(let v=-40; v<=80; v+=20){ g += `<line class="grid-l" x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`; }
  for(let v=-40; v<=80; v+=20) g += `<text x="${x(v)}" y="${H-16}" text-anchor="middle">${v}</text>`;
  g += `<text x="${(W+L)/2}" y="${H-2}" text-anchor="middle">eNPS сотрудников</text><text x="12" y="${T+4}">NPS клиентов</text>`;
  a.forEach(p => { const c = p.s.format==="Франшиза" ? "var(--c2)" : "var(--c1)"; g += `<circle cx="${x(p.e)}" cy="${y(p.s.qrNps)}" r="6" fill="${c}" stroke="var(--surface)" stroke-width="2" class="hit" data-salon="${p.s.id}" data-tip="${esc(p.s.short)}: eNPS ${p.e}, NPS клиентов ${p.s.qrNps}"/>`; });
  const avgI = PULSE.map((q,i)=>({l:q, v:Math.round(avg(a.map(p=>p.items[i]))*20)})).sort((p,q)=>p.v-q.v);
  return `
  <div class="ph"><div><h1>Опыт сотрудников</h1><p>Анонимный пульс-опрос консультантов раз в квартал (eNPS). Результат показывается по салону от 5 ответов. Где команда выгорает, там падает и оценка клиентов.</p></div><span class="sp"></span>${SRC_DEMO}<button class="btn pri" data-act="pulseNew">Запустить пульс-опрос</button></div>
  <div class="kpis"><div class="kpi"><span class="l">eNPS сети</span><span class="v">${Math.round(avg(a.map(p=>p.e)))}</span><span class="d">${sum(a.map(p=>p.n))} анонимных ответов</span></div><div class="kpi"><span class="l">Собственная розница</span><span class="v">${Math.round(avg(a.filter(p=>p.s.format!=="Франшиза").map(p=>p.e)))||"—"}</span></div><div class="kpi"><span class="l">Франшиза</span><span class="v">${Math.round(avg(a.filter(p=>p.s.format==="Франшиза").map(p=>p.e)))||"—"}</span></div></div>
  <div class="grid g-2-1">

  if(d.rsend){ const r = R[+d.rsend]; const v = $("#reply-"+d.rsend).value.trim(); if(!v){ toast("Ответ пустой"); return; } r.reply=v; st.rev.open=null; toast("Ответ отправлен в 2ГИС"); render(); return; }
  if(d.rvAlert){ const r = R[+d.rvAlert]; const id = 9000 + r.id; if(!ANS.find(a=>a.id===id)){ const stg = STAGES.find(x=>r.themes.includes(x.theme)) || STAGES[0]; const tp = TOUCH.find(x=>x.stage===stg.k) || TOUCH[0];
      ANS.unshift({id, salon:r.salon, tp:"Отзыв 2ГИС", stage:stg.k, route:tp.route, nps:r.stars<=2?2:5, csat:r.stars, ces:5, at:new Date(TODAY), alert:true, comment:r.text.slice(0,180)+(r.text.length>180?"…":""), consent:false, phone:"", name:"Автор отзыва 2ГИС", order:"—", status:"new", events:[{t:new Date(TODAY), txt:"Создан из отзыва 2ГИС"},{t:new Date(TODAY), txt:`Назначен: ${tp.route}`}], root:null, ticket:null, resurvey:false}); }
    st.drawer = {t:"alert", id}; render(); toast("Алерт создан из отзыва"); return; }
  if(d.tag){ st.modal = {t:"tag", id:+d.tag}; renderOverlays(); return; }
  if(d.addtag){ const r = R[+d.addtag]; const v = d.own ? $("#tag-new").value.trim() : d.t; if(!v) return; if(!r.tags.includes(v)) r.tags.push(v); st.modal=null; render(); return; }
  if(d.untag){ R[+d.untag].tags.splice(+d.i,1); render(); return; }
  if(d.ttab){ st.topicsTab=d.ttab; render(); return; }
  if(d.spike){ const [sid,th] = d.spike.split("|"); st.rev = {...st.rev, salon:sid, theme:th, tone:"neg", resp:"all", year:"all", q:"", show:25}; location.hash="reviews"; return; }
  if(d.msw){ st.msWave=d.msw; render(); return; }
  if(d.ms){ st.modal={t:"ms", id:+d.ms}; renderOverlays(); return; }
  if(d.geof){ st.geoF=d.geof; render(); return; }
  if(d.b2bReport!==undefined){ st.modal={t:"b2b"}; renderOverlays(); return; }
  if(d.mlNew!==undefined){ CAMPAIGNS.unshift({nm:"Новая рассылка · черновик", ch:"SMS", sv:SURVEYS[0].nm, sent:0, open:0, done:0, date:new Date(TODAY), st:"Черновик"}); toast("Черновик рассылки создан"); render(); return; }
  if(d.mlSend!==undefined){ const nm=$("#ml-name").value.trim(), to=$("#ml-to").value.trim(); if(!nm||!to){ toast("Укажите имя и телефон или email"); return; } SINGLES.unshift({nm, org:$("#ml-org").value.trim()||"—", to, ch:$("#ml-ch").value, at:new Date(TODAY), st:"Отправлено"}); toast("Анкета отправлена"); render(); return; }
  if(d.reft){ st.refTab=d.reft; render(); return; }
  if(d.rdel){ REASONS.splice(+d.rdel,1); render(); return; }
  if(d.radd!==undefined){ const v=$("#reason-new").value.trim(); if(!v) return; REASONS.push(v); render(); toast("Причина добавлена"); return; }
  if(d.copy){ const v=d.copy; try{ navigator.clipboard.writeText(v).then(()=>toast("Ссылка скопирована"),()=>toast(v)); }catch(_){ toast(v); } return; }
  if(d.biv){ st.bi.v=d.biv; render(); return; }
  if(d.rule){ const r = st.rules[+d.rule]; r.on = r.on?0:1; toast(r.on?"Правило включено":"Правило выключено"); render(); return; }
});
document.addEventListener("change", e => {
  const t = e.target, d = t.dataset;
  if(t.id==="f-role2"){ $("#f-role").value = t.value; }
  if(t.id==="f-role"||t.id==="f-role2"){ st.role=t.value; st.region="all"; st.format="all"; st.drawer=null; st.rev.salon="all"; const r = route(); if(location.hash.slice(1)!==r) location.hash=r; else render(); return; }
  if(t.id==="f-region"){ st.region=t.value; render(); return; }
  if(t.id==="f-format"){ st.format=t.value; render(); return; }
  if(t.id==="pol-gap"){ POLICY.gap=+t.value; toast("Не чаще одного опроса раз в "+t.value+" дней"); return; }
  if(t.id==="pol-max"){ POLICY.max=+t.value; toast("Не больше "+t.value+" опросов в месяц на клиента"); return; }
  if(t.id==="col-min"){ COLLECT.min=+t.value; toast("Приглашаем клиентов с NPS от "+t.value); return; }
  if(d.rec!=null){ const x = RECS[+d.rec]; x.status = t.value; toast(`${x.s.short}: «${x.status}»`); render(); return; }
  if(t.id==="f-period"){ st.period=t.value; render(); return; }
  if(t.id && t.id.startsWith("we-") && t.id!=="we-title"){ editorChange(t.id, t.value); return; }
  if(t.id==="df-dim"){ $("#df-val").innerHTML = dfVals(t.value); return; }
  if(["b-thr","b-route","b-lang"].includes(t.id)){ const sv = SURVEYS[st.builderSel]; sv[{"b-thr":"thr","b-route":"route","b-lang":"lang"}[t.id]] = t.value; toast(`«${sv.nm}»: ${t.closest(".ctl").querySelector("label").textContent.toLowerCase()} — ${t.value}`); return; }
  if(t.id==="bi-m"){ st.bi.m=t.value; render(); return; }
  if(t.id==="bi-d"){ st.bi.d=t.value; render(); return; }
  if(t.id==="ml-file" && t.files && t.files[0]){ const n = 50+Math.floor(Math.random()*900); IMPORTS.unshift({file:t.files[0].name, rows:n, ok:n-Math.floor(n*.02), at:new Date(TODAY)}); toast("Файл загружен: "+t.files[0].name); render(); return; }
  if(t.id==="al-status"){ st.al.status=t.value; render(); return; }
  if(t.id==="al-tp"){ st.al.tp=t.value; render(); return; }
  const rvMap = {"rv-salon":"salon","rv-tone":"tone","rv-theme":"theme","rv-resp":"resp","rv-year":"year"};
  if(rvMap[t.id]){ st.rev[rvMap[t.id]] = t.value; st.rev.show=25; render(); return; }
  if(d.qt!=null){ const q = SURVEYS[st.builderSel].q[+d.qt]; q.t=t.value; if(q.t==="tags"&&!q.opts) q.opts=["Вариант 1","Вариант 2"]; render(); return; }
  if(d.qopts!=null){ SURVEYS[st.builderSel].q[+d.qopts].opts = t.value.split(",").map(x=>x.trim()).filter(Boolean); $("#phone").innerHTML = phonePreview(SURVEYS[st.builderSel]); return; }
});
document.addEventListener("input", e => {
  const t = e.target, d = t.dataset;
  if(t.id==="rv-q"){ st.rev.q = t.value; st.rev.show=25; const pos=t.selectionStart; render(); const n=$("#rv-q"); n.focus(); n.setSelectionRange(pos,pos); return; }
  if(t.id==="we-title"){ st.edit.title = t.value; const h = document.querySelector(".ep .wt h3"); if(h) h.textContent = t.value || "Без названия"; const h2 = document.querySelector(".modal .mhead h2"); if(h2) h2.textContent = t.value || "Без названия"; return; }
  if(t.id==="cl-q"){ st.cl.q = t.value; const pos=t.selectionStart; render(); const n=$("#cl-q"); n.focus(); n.setSelectionRange(pos,pos); return; }
  if(t.id==="gsearch"){ const sr = $("#sres"); const html = searchResults(t.value); sr.innerHTML = html; sr.hidden = !html; return; }
  if(d.qtxt!=null){ SURVEYS[st.builderSel].q[+d.qtxt].txt = t.value; $("#phone").innerHTML = phonePreview(SURVEYS[st.builderSel]); return; }
  if(d.rtxt!=null){ R[+d.rtxt].draft = t.value; return; }
});
document.addEventListener("keydown", e => { if(e.key==="Escape"){ const sr=$("#sres"); if(sr && !sr.hidden){ sr.hidden=true; return; } if(st.modal||st.drawer){ if(st.modal){ st.modal=null; st.edit=null; } else st.drawer=null; renderOverlays(); } } });
const tip = $("#tip");
document.addEventListener("mouseover", e => { const t = e.target.closest("[data-tip]"); if(!t){ tip.hidden=true; return; } tip.textContent = t.dataset.tip; tip.hidden=false; });
document.addEventListener("mousemove", e => { if(tip.hidden) return; const x = Math.min(e.clientX+14, innerWidth-tip.offsetWidth-8), y = e.clientY+16+tip.offsetHeight>innerHeight ? e.clientY-tip.offsetHeight-10 : e.clientY+16; tip.style.left=x+"px"; tip.style.top=y+"px"; });
window.addEventListener("hashchange", () => { st.drawer=null; st.modal=null; st.edit=null; $(".rail").classList.remove("open"); render(); window.scrollTo(0,0); });
try{ const th = localStorage.getItem("askona-theme"); if(th==="light"||th==="dark") document.documentElement.setAttribute("data-theme", th); }catch(_){}
render();
document.addEventListener("click", e => { const b = e.target.closest("[data-scroll]"); if(b) window.scrollTo({top: b.dataset.scroll==="up" ? 0 : document.body.scrollHeight, behavior:"smooth"}); });

})();
</script>
