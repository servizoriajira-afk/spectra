<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Askona · Спектра</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Concept «ночь и рассвет»: night-navy rail and hero (the brand's sleep world), soft linen-blue ground, cobalt for interaction, dawn-peach for the one warm highlight. Display numerals in a wide rounded face. */
:root{
  --bg:#eef2f8; --surface:#ffffff; --surface-2:#f4f6fb; --ink:#0f1d3d; --ink-2:#47557a; --muted:#8792ad; --line:#e1e7f2; --line-2:#edf1f7;
  --night:#0a2252; --night-2:#123372; --night-ink:#e9efff; --night-mute:#9fb2dd;
  --accent:#2b5fd9; --accent-ink:#ffffff; --accent-soft:#e7eefd; --accent-dim:#c9d6f6;
  --dawn:#ff8a5c; --dawn-soft:#fff0e8; --hero-line:#ffb48f;
  --good:#17845b; --good-soft:#e1f4ea; --warn:#a96d00; --warn-soft:#fdf2da; --crit:#cf3c45; --crit-soft:#fde7e8;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#6250d6;
  --s1:var(--c1); --s2:var(--c2);
  --sh:0 1px 2px rgba(15,29,61,.05),0 6px 20px rgba(15,29,61,.06);
  --f-ui:"Onest","Segoe UI",system-ui,sans-serif; --f-num:"Unbounded","Onest",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1122; --surface:#111b31; --surface-2:#16223b; --ink:#e8edf9; --ink-2:#aab6d3; --muted:#7a87a6; --line:#223152; --line-2:#1b2844;
  --night:#060e22; --night-2:#0d1c40; --night-ink:#e9efff; --night-mute:#8fa2cf;
  --accent:#7aa2ff; --accent-ink:#081127; --accent-soft:#1a2a50; --accent-dim:#2a3a62;
  --dawn:#ff9a70; --dawn-soft:#3a2418; --hero-line:#ffb48f;
  --good:#46c38e; --good-soft:#12301f; --warn:#e5ae48; --warn-soft:#33270f; --crit:#f2737b; --crit-soft:#3a1a1e;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#9085e9;
  --sh:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1122; --surface:#111b31; --surface-2:#16223b; --ink:#e8edf9; --ink-2:#aab6d3; --muted:#7a87a6; --line:#223152; --line-2:#1b2844;
  --night:#060e22; --night-2:#0d1c40; --night-ink:#e9efff; --night-mute:#8fa2cf;
  --accent:#7aa2ff; --accent-ink:#081127; --accent-soft:#1a2a50; --accent-dim:#2a3a62;
  --dawn:#ff9a70; --dawn-soft:#3a2418; --hero-line:#ffb48f;
  --good:#46c38e; --good-soft:#12301f; --warn:#e5ae48; --warn-soft:#33270f; --crit:#f2737b; --crit-soft:#3a1a1e;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#9085e9;
  --sh:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:12px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.h3{font-size:13px;font-weight:600;color:var(--ink-2);margin-top:4px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;overflow-y:auto;padding:20px 14px 18px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:20px;color:var(--night-ink);
  background:radial-gradient(1.5px 1.5px at 30px 160px,rgba(255,255,255,.5),transparent 60%),radial-gradient(1px 1px at 180px 90px,rgba(255,255,255,.6),transparent 60%),radial-gradient(1px 1px at 120px 420px,rgba(255,255,255,.35),transparent 60%),radial-gradient(1.5px 1.5px at 210px 620px,rgba(255,255,255,.35),transparent 60%),radial-gradient(260px 200px at 110% -10%,rgba(255,180,143,.22),transparent 70%),linear-gradient(180deg,var(--night-2),var(--night))}
.brand{display:flex;flex-direction:column;gap:4px;padding:2px 8px 4px;text-decoration:none;color:var(--night-ink)}
.brand .mk{font-family:var(--f-num);font-weight:600;font-size:19px;letter-spacing:.24em}
.brand .bs{font-size:11.5px;color:var(--night-mute);letter-spacing:.02em}
.rail nav{display:flex;flex-direction:column;gap:18px}
.navgrp{display:flex;flex-direction:column;gap:2px}
.navgrp h4{margin:0 0 4px;padding:0 10px;font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--night-mute)}
.nav{position:relative;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--night-ink);opacity:.82;text-decoration:none;font-size:14px}
.nav:hover{background:rgba(255,255,255,.07);opacity:1}
.nav.on{background:rgba(255,255,255,.12);opacity:1;font-weight:600}
.nav.on::before{content:"";position:absolute;left:-4px;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--dawn)}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--dawn);color:#2a1206;border-radius:9px;padding:0 7px;font-weight:700;line-height:18px}
.rail .foot{margin-top:auto;font-size:11.5px;color:var(--night-mute);padding:12px 10px 0;border-top:1px solid rgba(255,255,255,.1);line-height:1.45}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-block:10px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.top .sp{flex:1}
.fld{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.gs{position:relative;display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:0 10px;min-width:170px;flex:0 1 240px;color:var(--muted)}
.gs input{border:0;background:transparent;min-height:34px;width:100%;padding:0;outline:none}
.top select{max-width:200px}
.gs:focus-within{border-color:var(--accent)}
.sres{position:absolute;left:0;top:calc(100% + 6px);width:min(420px,90vw);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:6px;z-index:40;max-height:60vh;overflow:auto;color:var(--ink)}
.sg{padding:4px}
.sgh{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 8px}
.sr{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:7px 8px;text-decoration:none;color:var(--ink)}
.sr span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.sr:hover{background:var(--accent-soft)}
.bell{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:36px;display:grid;place-items:center;color:var(--ink-2)}
.bell span{position:absolute;top:-5px;right:-5px;background:var(--dawn);color:#2a1206;font-size:10.5px;font-weight:700;border-radius:9px;padding:0 5px;line-height:17px}
.who{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);border:0;background:none;padding:2px}
.who .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--night-2),var(--accent));color:#fff;display:grid;place-items:center;font-weight:700;font-size:11.5px}
select,input[type=text],input[type=search],input[type=email],input[type=tel],textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-height:36px;max-width:100%}
textarea{width:100%;resize:vertical;min-height:90px;line-height:1.45}
.burger{display:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:36px;place-items:center}

.mod{padding-top:24px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px}
.mod .eb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--accent);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.mod .tabs{margin-top:8px}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 16px}
.ph > div:first-child{display:flex;flex-direction:column;gap:6px;min-width:0}
.ph h1{font-family:var(--f-num);font-size:26px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.ph p{margin:0;color:var(--ink-2);max-width:78ch}
.ph .sp{flex:1}
.page{padding-block:18px 56px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;max-width:1480px;width:100%}

.grid{display:grid;gap:18px;align-items:start}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g-1-2{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--sh);padding:20px 22px;min-width:0;display:flex;flex-direction:column;gap:14px;border:0;text-align:left;color:var(--ink)}
.card h2{font-size:15.5px;font-weight:600}
.card .sub{color:var(--muted);font-size:12.5px;margin-top:-10px}
.card-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-h .sp{flex:1}
.demo{font-size:10.5px;color:var(--muted);background:var(--surface-2);border-radius:6px;padding:0 7px;line-height:19px;white-space:nowrap;letter-spacing:.02em}
.integ{cursor:pointer;transition:transform .15s,box-shadow .15s}
.integ:hover{transform:translateY(-2px)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(220px,1fr) minmax(0,2fr) minmax(200px,1fr);gap:20px;align-items:stretch;border-radius:22px;padding:24px 26px;color:var(--night-ink);position:relative;overflow:hidden;
  background:radial-gradient(240px 240px at 92% -30%,rgba(255,180,143,.45),transparent 70%),radial-gradient(1.5px 1.5px at 22% 30%,rgba(255,255,255,.7),transparent 60%),radial-gradient(1px 1px at 48% 18%,rgba(255,255,255,.6),transparent 60%),radial-gradient(1px 1px at 70% 72%,rgba(255,255,255,.45),transparent 60%),linear-gradient(120deg,var(--night) 0%,var(--night-2) 70%,#1d3f8a 100%)}
.hero-main{display:flex;flex-direction:column;gap:6px;justify-content:center}
.hero-k{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--night-mute)}
.hero-v{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.hero-v span{font-family:var(--f-num);font-size:64px;font-weight:600;line-height:1;letter-spacing:-.03em}
.hero-v small{font-size:16px;color:var(--night-mute)}
.hero-v em{font-style:normal;font-size:13px;font-weight:600;padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.1)}
.hero-v em.up{color:#8ef0c0} .hero-v em.dn{color:#ffb0b4}
.hero-s{font-size:12.5px;color:var(--night-mute)}
.hero-chart{min-width:0;align-self:center}
.hero-chart svg text{fill:var(--night-mute)}
.hero-chart svg .grid-l{stroke:rgba(255,255,255,.08)}
.hero-chart svg circle{stroke:var(--night-2)}
.hero-side{display:flex;flex-direction:column;gap:8px;justify-content:center}
.hs{display:flex;align-items:center;gap:12px;text-align:left;border:0;border-radius:12px;padding:10px 12px;background:rgba(255,255,255,.07);color:var(--night-ink);transition:background .15s}
.hs:hover{background:rgba(255,255,255,.14)}
.hs b{font-family:var(--f-num);font-size:22px;font-weight:600;min-width:44px}
.hs span{font-size:12.5px;color:var(--night-mute)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.kpi{background:var(--surface);border-radius:16px;box-shadow:var(--sh);padding:16px 18px;display:flex;flex-direction:column;gap:3px;min-width:0;border:0;text-align:left;color:var(--ink)}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .v{font-family:var(--f-num);font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.25}
.kpi .v small{font-family:var(--f-ui);font-size:13px;color:var(--muted);font-weight:500}
.kpi .d{font-size:12px;color:var(--ink-2)}
.kpi.link{cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative}
.kpi.link::after{content:"→";position:absolute;right:16px;top:14px;color:var(--muted);transition:transform .15s,color .15s}
.kpi.link:hover{transform:translateY(-2px)}
.kpi.link:hover::after{color:var(--accent);transform:translateX(3px)}
.card .kpi,.drawer .kpi,.modal .kpi{background:var(--surface-2);box-shadow:none}
.up{color:var(--good)} .dn{color:var(--crit)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 13px;min-height:36px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;color:var(--ink);font-weight:500;transition:border-color .15s,color .15s,background .15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 28%,transparent)}
.btn.pri:hover{color:var(--accent-ink);filter:brightness(1.07)}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}
.btn.danger:hover{background:var(--crit);color:#fff;border-color:var(--crit)}
.btn.sm{padding:3px 10px;min-height:30px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.45;cursor:default}
.lnk{border:0;background:none;padding:0;color:var(--accent);text-align:left;cursor:pointer}
.lnk:hover{text-decoration:underline}
.lnk-pill{border:0;background:none;padding:0;cursor:pointer}
.lnk-pill:hover .pill{filter:brightness(.95);text-decoration:underline}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)}
.small{font-size:12.5px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill.good{color:var(--good);background:var(--good-soft)}
.pill.warn{color:var(--warn);background:var(--warn-soft)}
.pill.crit{color:var(--crit);background:var(--crit-soft)}
.pill.neu{color:var(--ink-2);background:var(--surface-2)}
.pill.acc{color:var(--accent);background:var(--accent-soft)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;border:1px solid var(--line);border-radius:7px;padding:1px 8px;color:var(--ink-2);background:var(--surface-2);white-space:nowrap}
.chip.neg{border-color:transparent;background:var(--crit-soft);color:var(--crit)}
.chip.pos{border-color:transparent;background:var(--good-soft);color:var(--good)}
.chip button{border:0;background:none;padding:0;color:inherit}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--accent);color:var(--accent)}

.tbl-wrap{overflow-x:auto;margin:0 -22px;padding:0 22px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:500;font-size:12px;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th.sort{cursor:pointer}
th.sort:hover{color:var(--accent)}
td{padding:10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--accent-soft)}
td.r,th.r{text-align:right}
.sev{width:4px;padding:0!important}
.sev i{display:block;width:4px;height:28px;border-radius:2px}

.bar{display:grid;grid-template-columns:minmax(110px,200px) minmax(0,1fr) 56px;gap:10px;align-items:center;font-size:13px;border-radius:8px;padding:2px 4px;margin:0 -4px}
.bar .t{height:9px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:0 5px 5px 0;background:var(--accent);transition:width .3s}
.bar .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.bar.clk{cursor:pointer}
.bar.clk:hover{background:var(--accent-soft)}
.bar.dim{opacity:.4}
.bars{display:flex;flex-direction:column;gap:7px}

.score{display:inline-flex;align-items:center;justify-content:center;min-width:42px;height:26px;border-radius:8px;font-weight:650;font-variant-numeric:tabular-nums;font-size:13px}
.score.good{background:var(--good-soft);color:var(--good)}
.score.warn{background:var(--warn-soft);color:var(--warn)}
.score.crit{background:var(--crit-soft);color:var(--crit)}

.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line-2);align-items:flex-start}
.li:first-child{border-top:0;padding-top:0}
.li .ic{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:700}
.ic.crit{background:var(--crit-soft);color:var(--crit)}
.ic.warn{background:var(--warn-soft);color:var(--warn)}
.ic.good{background:var(--good-soft);color:var(--good)}
.ic.acc{background:var(--accent-soft);color:var(--accent)}
.li .b{flex:1;min-width:0}
.li .b b{display:block;font-weight:600}
.li .b span{color:var(--ink-2);font-size:12.5px}

.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:7px 14px;border-radius:999px;color:var(--ink-2);text-decoration:none;font-size:13.5px;font-weight:500}
.tab:hover{background:var(--surface);color:var(--ink)}
.tab.on{background:var(--night-2);color:#fff}
.card .tabs{border-bottom:1px solid var(--line);padding-bottom:10px}
.card .tab.on{background:var(--accent-soft);color:var(--accent)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:4px 12px;font-size:12.5px;border-radius:8px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(15,29,61,.14)}

/* journey */
.journey{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.stage{border:0;text-align:left;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--surface-2);min-width:0;color:var(--ink);cursor:pointer;transition:transform .15s}
.stage:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.stage.after{background:var(--dawn-soft)}
.stage .n{font-family:var(--f-num);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.stage .nm{font-weight:600}
.stage .ds{font-size:12px;color:var(--ink-2)}
.stage .meter{height:5px;border-radius:3px;background:var(--surface);overflow:hidden}
.stage .meter i{display:block;height:100%;background:var(--crit);border-radius:0 3px 3px 0}
.stage .hr{background:color-mix(in srgb,var(--ink) 10%,transparent)}
.payline{font-size:12px;color:var(--muted);grid-column:1/-1}

/* reviews */
.rev{border-top:1px solid var(--line-2);padding:14px 0;display:flex;flex-direction:column;gap:8px}
.rev:first-child{border-top:0;padding-top:0}
.stars{color:#f0a400;letter-spacing:1px;font-size:13px}
.stars .off{color:var(--line)}
.rev p{margin:0;max-width:85ch}
.reply{background:var(--surface-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}

/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(6,14,34,.42);z-index:60;display:flex;justify-content:flex-end;backdrop-filter:blur(2px)}
.drawer{background:var(--bg);width:min(720px,100%);height:100%;overflow-y:auto;padding-block:max(20px,env(safe-area-inset-top,0px)) max(30px,env(safe-area-inset-bottom,0px));padding-left:22px;padding-right:max(22px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;box-shadow:-8px 0 30px rgba(0,0,0,.2)}
.drawer .hd{display:flex;align-items:flex-start;gap:10px}
.drawer .hd h2{font-family:var(--f-num);font-size:20px;font-weight:600}
.x{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:10px;width:36px;height:36px;flex:none;color:var(--ink-2)}
.x:hover{color:var(--accent);border-color:var(--accent)}
.modal-wrap{position:fixed;inset:0;background:rgba(6,14,34,.42);z-index:70;display:grid;place-items:center;padding:16px;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border-radius:20px;width:min(640px,100%);max-height:90vh;overflow-y:auto;padding:22px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(6,14,34,.35)}
.modal.wide{width:min(1060px,100%)}
.mhead{display:flex;align-items:flex-start;gap:12px}
.mhead h2{font-family:var(--f-num);font-size:19px;font-weight:600;line-height:1.3}
.mfoot{border-top:1px solid var(--line-2);padding-top:14px}
.modal .tbl-wrap{margin:0 -24px;padding:0 24px}

.tl{display:flex;flex-direction:column;border-left:2px solid var(--line);margin-left:6px}
.tl .ev{position:relative;padding:0 0 12px 16px;font-size:13px}
.tl .ev::before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl .ev .w{font-size:11.5px;color:var(--muted)}

.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
.ctl{display:flex;flex-direction:column;gap:5px;min-width:0}
.ctl label{font-size:12px;color:var(--muted)}
.ctl input,.ctl select{width:100%}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:4px 10px}
.drop{border:1.5px dashed var(--accent-dim);background:var(--accent-soft);border-radius:14px;padding:18px;text-align:center;color:var(--ink-2);font-size:13px;display:flex;flex-direction:column;gap:6px;align-items:center;cursor:pointer}
.note{background:var(--dawn-soft);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--ink)}
.note b{color:var(--ink)}
.quote{border-left:3px solid var(--dawn);padding-left:12px;color:var(--ink-2);font-size:13px;margin:0}
.hr{height:1px;background:var(--line)}
.empty{color:var(--muted);text-align:center;padding:24px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend i.dash{height:0;border-top:2px dashed var(--accent);border-radius:0;width:14px;vertical-align:3px}
svg text{fill:var(--muted);font-size:11px;font-family:var(--f-ui)}
svg .grid-l{stroke:var(--line-2)}
svg .hit{cursor:pointer}
svg path.dimf{opacity:.3}
.ins{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--accent-soft);font-size:13px}
.ins .ic{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:12px;background:var(--surface);color:var(--accent)}
.toggle{position:relative;width:40px;height:23px;border-radius:12px;background:var(--line);border:0;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on{background:var(--accent)}
.toggle.on::after{left:20px}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.pm{width:34px;height:28px;border-radius:8px;border:1px dashed var(--line);background:transparent;color:var(--muted);font-weight:700}
.pm.on{background:var(--good-soft);color:var(--good);border:1px solid transparent}
.pm:hover{border-color:var(--accent)}
.heat td.h{text-align:center;font-variant-numeric:tabular-nums;font-size:12px;min-width:44px;border-radius:4px}
.heat td.clk{cursor:pointer}
.heat td.clk:hover{outline:2px solid var(--accent);outline-offset:-2px}
.tip{position:fixed;z-index:90;pointer-events:none;background:var(--night);color:var(--night-ink);font-size:12px;padding:7px 10px;border-radius:9px;max-width:280px;box-shadow:0 6px 18px rgba(0,0,0,.25);line-height:1.35}
.toast{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:95;background:var(--night);color:var(--night-ink);padding:10px 18px;border-radius:12px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:calc(100% - 32px)}
.toast::before{content:"●";color:var(--dawn);margin-right:8px}

/* builder */
.builder{display:grid;grid-template-columns:240px minmax(0,1fr) 300px;gap:18px;align-items:start}
.svlist{display:flex;flex-direction:column;gap:6px}
.sv{border:0;background:var(--surface);box-shadow:var(--sh);border-radius:12px;padding:11px 13px;text-align:left;display:flex;flex-direction:column;gap:2px}
.sv.on{background:var(--night-2);color:#fff}
.sv.on span{color:var(--night-mute)}
.sv b{font-size:13px}
.sv span{font-size:12px;color:var(--muted)}
.q{border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--surface);box-shadow:var(--sh)}
.q .qh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.q .qn{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.q input[type=text]{width:100%}
.logic{font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:4px 8px;align-self:flex-start}
.phone{position:sticky;top:84px;border:10px solid #0b1636;border-radius:32px;background:#f4f1ee;color:#1d2a2e;min-height:520px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sh)}
.phone .pb{background:#0b2a5b;color:#fff;padding:14px 16px 12px;display:flex;flex-direction:column;gap:2px}
.phone .pb b{letter-spacing:.24em;font-size:13px;font-family:var(--f-num)}
.phone .pb span{font-size:11px;opacity:.8}
.phone .pc{padding:14px 16px;display:flex;flex-direction:column;gap:14px;font-size:13px}
.phone .pq b{display:block;margin-bottom:8px;font-weight:600}
.nps{display:grid;grid-template-columns:repeat(11,1fr);gap:3px}
.nps button{border:1px solid #cfd6da;background:#fff;border-radius:5px;font-size:11px;padding:5px 0;color:#1d2a2e}
.nps button.on{background:#0b2a5b;color:#fff;border-color:#0b2a5b}
.faces{display:flex;gap:6px}
.faces button{flex:1;border:1px solid #cfd6da;background:#fff;border-radius:8px;padding:6px 0;font-size:12px;color:#1d2a2e}
.faces button.on{background:#0b2a5b;color:#fff}
.tagset{display:flex;flex-wrap:wrap;gap:5px}
.tagset button{border:1px solid #cfd6da;background:#fff;border-radius:14px;padding:3px 9px;font-size:11.5px;color:#1d2a2e}
.tagset button.on{background:#e3ecf5;border-color:#0b2a5b}
.phone textarea{background:#fff;border-color:#cfd6da;color:#1d2a2e;min-height:60px}
.phone .send{background:#0b2a5b;color:#fff;border:0;border-radius:8px;padding:9px}
.qr{width:84px;height:84px;image-rendering:pixelated;border:4px solid #fff;border-radius:6px;background:#fff}
.qr.sm{width:44px;height:44px;border-width:2px}
.mockups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.mockups figure{margin:0;border-radius:14px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:#0f1d3d;background:#f4f1ee}
.mockups figure b{font-size:14px}
.mockups figure span{font-size:11.5px;color:#55627f}
.mockups figcaption{font-size:11.5px;color:#55627f;margin-top:auto;padding-top:8px;border-top:1px dashed #cfd6da;width:100%}
.mockups .mk-brand{font-family:var(--f-num);letter-spacing:.24em;font-size:12px;font-weight:600;color:#0b2a5b}
.mockups .mk-tent{background:linear-gradient(180deg,#fff,#eef2f8)}
.mockups .mk-stick{flex-direction:row;flex-wrap:wrap;justify-content:center;text-align:left;background:#fff;border:1px dashed #cfd6da}
.mockups .mk-stick > div{display:flex;flex-direction:column;gap:2px}
.mockups .mk-post{background:#0b2a5b;color:#fff}
.mockups .mk-post .mk-brand{color:#ffb48f}
.mockups .mk-post figcaption{color:#9fb2dd;border-color:rgba(255,255,255,.2)}
.exp{display:flex;align-items:center;gap:12px}
.xl{width:44px;height:52px;border-radius:8px;background:#1d7a45;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;letter-spacing:.04em}
.toc{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.toc li span{display:block;font-size:12.5px;color:var(--muted)}

/* ---------- BI ---------- */
.dbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:space-between}
.dtabs{display:flex;gap:6px;flex-wrap:wrap}
.dtab{border:0;background:var(--surface);box-shadow:var(--sh);border-radius:12px;padding:8px 14px;display:inline-flex;align-items:center;gap:8px;font-weight:500;color:var(--ink-2)}
.dtab span{font-size:11px;background:var(--surface-2);border-radius:8px;padding:0 6px;color:var(--muted)}
.dtab.on{background:var(--night-2);color:#fff}
.dtab.on span{background:rgba(255,255,255,.15);color:#fff}
.dtab.add{background:transparent;box-shadow:none;border:1.5px dashed var(--accent-dim);color:var(--accent)}
.xf{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--accent-soft);border-radius:12px;padding:8px 12px}
.xfc{background:var(--surface)!important;border-color:transparent!important;color:var(--ink)!important}
.dgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;align-items:stretch}
.dgrid.one{grid-template-columns:minmax(0,1fr)}
.wdg{grid-column:span var(--span);background:var(--surface);border-radius:18px;box-shadow:var(--sh);padding:16px 18px;min-width:0;display:flex;flex-direction:column;gap:10px}
.dgrid.one .wdg{grid-column:auto}
.wh{display:flex;align-items:flex-start;gap:8px}
.wt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.wt h3{font-size:14.5px;font-weight:600}
.wd{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wdg{position:relative}
.wtools{position:absolute;top:10px;right:10px;display:flex;gap:1px;opacity:0;transition:opacity .15s;background:var(--surface);border-radius:10px;box-shadow:var(--sh);padding:2px;z-index:2}
.wdg:hover .wtools,.wdg:focus-within .wtools{opacity:1}
@media (hover:none){.wtools{opacity:1;position:static;box-shadow:none;background:transparent;flex-wrap:wrap}}
.ib{border:0;background:transparent;border-radius:8px;width:28px;height:28px;display:grid;place-items:center;color:var(--ink-2)}
.ib:hover{background:var(--accent-soft);color:var(--accent)}
.ib svg.i{width:16px;height:16px}
.wb{min-width:0;flex:1;display:flex;flex-direction:column;justify-content:center}
.wb.big{min-height:300px}
.wkpi{display:flex;flex-direction:column;gap:2px}
.wk-v{font-family:var(--f-num);font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1.15;color:var(--ink)}
.wk-l{font-size:12.5px;color:var(--ink-2)}
.wk-n{font-size:11.5px;color:var(--muted)}
.wdg-kpi{background:linear-gradient(160deg,var(--surface),var(--surface-2))}
.wadd{grid-column:span var(--span);border:1.5px dashed var(--accent-dim);background:transparent;border-radius:18px;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--accent);padding:16px}
.wadd:hover{background:var(--accent-soft)}
.wadd span{font-size:12px;color:var(--muted)}
.pie{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.pleg{display:flex;flex-direction:column;gap:2px;flex:1;min-width:160px}
.pl{display:grid;grid-template-columns:12px minmax(0,1fr) auto 44px;gap:8px;align-items:center;border:0;background:none;padding:5px 6px;border-radius:8px;text-align:left;font-size:13px;color:var(--ink)}
.pl:hover:not([disabled]){background:var(--accent-soft)}
.pl i{width:10px;height:10px;border-radius:3px}
.pl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.pl b{font-variant-numeric:tabular-nums;font-weight:600}
.pl em{font-style:normal;color:var(--muted);font-size:12px;text-align:right}
.pl.dim{opacity:.4}
.pl[disabled]{cursor:default}
.editor{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:20px;align-items:start}
.ef{display:flex;flex-direction:column;gap:12px}
.ep{display:flex;flex-direction:column;gap:8px;position:sticky;top:0;background:var(--surface-2);border-radius:16px;padding:14px}
.ep .wdg{box-shadow:none}
.types{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.ty{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--ink-2)}
.ty svg.i{width:20px;height:20px}
.ty:hover{border-color:var(--accent);color:var(--accent)}
.ty.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tpls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tpl{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.tpl:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.tpl input{position:absolute;opacity:0;pointer-events:none}
.tpl span{font-size:12px;color:var(--muted)}
.dsc .card-h svg.i{color:var(--accent)}

@media (max-width:1180px){.builder{grid-template-columns:200px minmax(0,1fr)}.builder .phonecol{grid-column:1/-1}.phone{position:static;max-width:340px}.hero{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.hero-chart{grid-column:1/-1;order:3}}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g-2-1,.g-1-2{grid-template-columns:minmax(0,1fr)}.journey{grid-template-columns:repeat(3,minmax(0,1fr))}.wdg,.wadd{grid-column:span 12}.wdg-kpi{grid-column:span 6}.editor{grid-template-columns:minmax(0,1fr)}.ep{position:static}.mockups{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;left:0;top:0;bottom:0;width:268px;z-index:80;transform:translateX(-100%);transition:transform .2s;padding-top:max(20px,env(safe-area-inset-top,0px))}
  .rail.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4)}
  .burger{display:inline-grid}
  .g2,.form,.tpls{grid-template-columns:minmax(0,1fr)}
  .builder{grid-template-columns:minmax(0,1fr)}
  .who .wn{display:none}
  .gs{order:5;flex:1 1 100%}
  .hero{grid-template-columns:minmax(0,1fr)}
  .mod,.page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
@media (max-width:560px){.g4{grid-template-columns:minmax(0,1fr)}.journey{grid-template-columns:repeat(2,minmax(0,1fr))}.bar{grid-template-columns:minmax(90px,120px) minmax(0,1fr) 46px}.top .hide-sm{display:none}.wdg-kpi{grid-column:span 12}.hero-v span{font-size:52px}.types{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* competitive features */
.flow{display:flex;flex-direction:column;gap:6px}
.fs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;border-radius:12px;padding:8px 10px;font-size:12.5px}
.fs span{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;min-width:34px}
.fs b{font-weight:500;background:var(--surface);border-radius:7px;padding:2px 8px}
.fs.if{background:var(--accent-soft);color:var(--accent)}
.fs.and{background:var(--surface-2);color:var(--ink-2)}
.fs.then{background:var(--dawn-soft);color:var(--ink)}
.fs b{color:var(--ink)}
.scn .toggle{margin-right:2px}
.chat{display:flex;flex-direction:column;gap:6px;background:#e9e2d8;border-radius:14px;padding:12px;color:#1d2a2e}
.msg{max-width:80%;border-radius:12px;padding:7px 10px;font-size:13px;background:#fff}
.msg.out{align-self:flex-end;background:#d8f5c8}
.msg.btns{display:flex;gap:6px;background:transparent;padding:0;flex-wrap:wrap}
.msg.btns span{background:#fff;border-radius:10px;padding:5px 9px;color:#2b5fd9;font-size:12px}
.wprev-site{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#f4f6fb;color:#1d2a2e}
.ws-head{background:#0b2a5b;color:#fff;padding:8px 12px;font-size:12px}
.ws-card{margin:16px auto;max-width:340px;background:#fff;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.ws-card .faces button{font-size:18px;padding:6px 0}
.phone .send.alt{background:#fff;color:#0b2a5b;border:1px solid #0b2a5b}
.phone .pq span{font-size:12.5px;color:#55627f}
.phone.mob{position:static;width:300px;max-width:100%}
.phone.mob .pc{flex:1;gap:8px;background:#eef2f8}
.ma-h{font-weight:700;font-size:15px;color:#0f1d3d}
.ma-i{background:#fff;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.ma-i span{color:#55627f}
.ma-i em{font-style:normal;font-size:11px;font-weight:700;color:#cf3c45}
.ma-push{background:#0f1d3d;color:#fff;border-radius:12px;padding:10px;font-size:12px}
.ma-btn{background:#2b5fd9;color:#fff;border-radius:10px;padding:9px;text-align:center;font-weight:600}
.ma-big{font-family:var(--f-num);font-size:44px;font-weight:600;color:#0b2a5b;display:flex;flex-direction:column;line-height:1.1}
.ma-big small{font-family:var(--f-ui);font-size:12px;color:#55627f;font-weight:400}
.ma-nav{display:flex;border-top:1px solid #dfe5ef;background:#fff}
.ma-nav button{flex:1;border:0;background:none;padding:10px 0;font-size:12px;color:#55627f}
.ma-nav button.on{color:#2b5fd9;font-weight:700}

/* ================= eScan visual system (overrides) ================= */
:root{
  --bg:#f8f9fb; --surface:#ffffff; --surface-2:#f3f4f7; --ink:#111827; --ink-2:#4b5563; --muted:#6b7280; --line:#e5e7eb; --line-2:#eef0f3;
  --night:#111827; --night-2:#111827; --night-ink:#ffffff; --night-mute:#9ca3af;
  --accent:#1a56db; --accent-ink:#ffffff; --accent-soft:#ebf2fe; --accent-dim:#c3d5f8;

риобрести подушку ребенку, выбрали. И уже на кассе продавцы стали настаивать, чтобы мы дали им свой номер"],["Волгоград","ТРЦ Акварель, Университетский проспект, 107","2025-11-07",5,0,["Доставка и сроки"],"Выбрала диван) жду доставку, надеюсь все будет ок"],["Волгоград","ТРЦ Акварель, Университетский проспект, 107","2026-06-18",5,1,[],"Очень боялась, что мебель вживую окажется хуже, чем на сайте. А тут наоборот, прикиньте, смотрелось лучше чем на картинке. Такое нечасто бывает"],["Волгоград","ТРЦ Акварель, Университетский проспект, 107","2026-06-18",5,1,["Цены, акции, оплата","Консультация (позитив)"],"Покупка прошла без лишней суеты. Рассказали коротко, понятно и по делу. Спасибо что цените время как своё, так и покупателя"],["Волгоград","ТРЦ Акварель, Университетский проспект, 107","2026-06-18",5,1,["Доставка и сроки","Качество товара / брак","Консультация (позитив)"],"Выбирали матрас для ребёнка, поэтому особенно внимательно относились к жёсткости и качеству. Нам всё подробно объяснили и помогли подобрать подходящую модель. Затем с доставкой помогли"],["Волгоград","ТРЦ Акварель, Университетский проспект, 107","2026-06-19",5,1,["Консультация (позитив)"],"Искал одеяло в пределах определенного бюджета. Помогли найти подходящее решение. Огромное человеческое спасибо"],["Волгоград","ТРЦ Акварель, Университетский проспект, 107","2026-06-20",5,1,["Консультация (позитив)"],"Мы искали подарок родителям. Хотелось что-то не “лишь бы подороже”, а реально удобное. Помогли выбрать кровать без лишнего пафоса, но добротную. Родители потом сказали, что спят отлично"],["Волгоград","ТРЦ Акварель, Университетский проспект, 107","2026-07-08",5,1,["Гарантия, возврат, претензии"],"Подушки здесь просто любовь. сразу взяла себе, потом вернулась за второй для мужа. Теперь он тоже в клубе людей, которые наконец-то нормально спят"],["Волгоград","ТРЦ Акварель, Университетский проспект, 107","2026-07-09",5,1,[],"Присматривала кровать дочке-подростку. Хотелось, чтобы не “детское-детское”, а чт тация (позитив)"],"Отличный матрац. Качество безупречное. Спасибо Askona за отличную продукцию. Менеджеры отличные девушки, которые могут грамотно рассказать про продукцию. Спасибо."],["Казань","ТЦ ГоркиПарк, улица Рихарда Зорге, 11Б","2026-02-14",5,1,["Консультация (позитив)"],"Приехали, консультант топ. Не поддалась на мои провокации, сохраняла профессионализм. Как итог купили матрац за 55к и все ок пока что, проверим матрац, надеюсь все будет удобно."],["Казань","ТЦ ГоркиПарк, улица Рихарда Зорге, 11Б","2026-03-19",1,1,["Доставка и сроки","Цены, акции, оплата"],"Приобрел у данной \"замечательной\" компании матрас. При оформлении нам сообщили что при покупке второго матраса скидка 50%, решили сделать подарок бабушке и приобрели сразу 2 матраса. Вот тут то и начались приколы, доставку на 2 ад"],["Казань","ТЦ ГоркиПарк, улица Рихарда Зорге, 11Б","2026-05-31",1,1,["Качество товара / брак","Гарантия, возврат, претензии","Грубость / невнимание персонала"],"Продали бракованную простынь и отказались сразу обменять! Проверяйте всё при покупке, иначе куча проблем. Персонал разговаривает через губу."],["Казань","ТЦ ГоркиПарк, улица Рихарда Зорге, 11Б","2026-07-11",5,1,["Консультация (позитив)","Атмосфера и салон"],"Приобрели диван и остались очень довольны. Отдельное спасибо консультанту Р., помогла с выбором, подробно ответила на все вопросы, была внимательной, доброжелательной и настоящим профессионалом своего дела. Диван доставили точ"],["Казань","ТЦ ГоркиПарк, улица Рихарда Зорге, 11Б","2026-07-19",2,1,["Наличие и комплектность заказа"],"Купил подушку и чехол в казан моле. В наличии было только ТЦ горки парк. Пока ехал в машине уснула годовалый ребенок, и чтобы не оставлять одного ребенка в машине позвонил в филиал Асконы и вежливо попросил вынести подушку. Объясн"],["Казань","ТЦ ГоркиПарк, улица Рихарда Зорге, 11Б","2026-08-21",5,1,["Качество товара / брак","Цены, акции, оплата","Консультация (позитив)"],"Отличный магазин ортопедических матрасов и кроватей! Очень все толково и вежливо проконсультировала сотрудница. Учла все наши пожелания и сделала приятную скидку. Если вы хотите приобрести качественную кро"],["Казань","ТЦ ГоркиПарк, улица Рихарда Зорге, 11Б","2026-09-09",1,1,["Доставка и сроки"],"Доставка ужасна! Заказали в дом, где не живем. Не предупредили хотя бы за полчаса, должны заранее предупредить. приехали раньше времени они и уехали раньше. не ждали. Спасибо!!!!!!! Куда еще можно написать об этом?"],["Казань","ТЦ ГоркиПарк, улица Рихарда Зорге, 11Б","2026-10-10",1,1,["Грубость / невнимание персонала"],"Пришел в магазин покупать матрас , никто не подошел , начал сам выбирать матрасы аккуратно ложится на них ( нигде не было написано что ложиться нельзя), после минут десяти подошла продавец консультант и прогнала меня сказав что ло"],["Казань","ТЦ ГоркиПарк, улица Рихарда Зорге, 11Б","2026-10-22",1,1,["Наличие и комплектность заказа"],"Пришла в магазин уточнить по наличию матраса с интернет магазина, сказали, что таких «дешевых матрасов у них в магазине представлены» и тыкнули пальцем, что у них только от 50тысяч, я попросила показать данные матрасы, на что опят"],["Калининград","ТРЦ Европа, Театральная улица, 30","2023-12-08",4,1,["Цены, акции, оплата","Атмосфера и салон"],"Покупал в Асконе кровать - хороший выбор, адекватные цены. А вот постельное белье дорогое относительно рынка, за что минус звезда."],["Калининград","ТРЦ Европа, Театральная улица, 30","2025-02-09",5,1,["Цены, акции, оплата"],"Отличный магазин, заказывала матрац, так как мы новоселы, сделали скидку и предоставили основание и матрац пока не пришёл заказ. Матрац двусторонний , жёсткий и помягче. Также взяли наматрасник очень приятный к телу"],["Калининград","ТРЦ Европа, Театральная улица, 30","2025-02-09",5,1,["Консультация (позитив)","Атмосфера и салон"],"Отличный салон, менеджер помогла с выбором подушки, всем осталась довольна😊"],["Калининград","ТРЦ Европа, Театральная улица, 30","2025-03-29",5,1,["Доставка и сроки","Гарантия, возврат, претензии"],"За асов и помогла подобрать подходящий для нашего ребенка. Также приобрели постельное, подушку и одеяло. Все понравилось."],["Пермь","ТЦ Планета, шоссе Космонавтов, 162Б","2026-06-09",5,1,["Атмосфера и салон"],"Диван понравился ещё в магазине, но окончательно убедились в выборе уже конечно дома. Смотрится красиво, механизм удобный, ткань приятная. Хорошая вещь, которая действительно радует"],["Пермь","ТЦ Планета, шоссе Космонавтов, 162Б","2026-06-17",1,1,["Качество товара / брак"],"Ужасное место,никому не советую, сначала стараются продать товар как качественный, менеджер бегает вокруг тебя даёт визитку, говорит звоните по любым вопросам,потом все пропадают,то на выходном,то я все сделала разбирайтесь сами."],["Пермь","ТЦ Планета, шоссе Космонавтов, 162Б","2026-06-17",5,1,["Консультация (позитив)"],"Очень приятные продавцы! Все рассказали и показали!"],["Пермь","ТЦ Планета, шоссе Космонавтов, 162Б","2026-06-18",5,1,["Гарантия, возврат, претензии","Консультация (позитив)"],"Выбирала подушку. Консультант очень тактично и развернуто рассказала о товаре. Очень понравилось. Надеюсь придти ещё раз, или два."],["Пермь","ТЦ Планета, шоссе Космонавтов, 162Б","2026-06-18",5,1,["Атмосфера и салон"],"Уютный магазин и приятное обслуживание. Выбор делать было легко и приятно"],["Пермь","ТЦ Планета, шоссе Космонавтов, 162Б","2026-07-09",5,1,["Качество товара / брак","Сборка"],"покупали здесь кровать в спальню. очень переживала за цвет и не будет ли отличаться от картинки на сайте, но по факту даже лучше, чем на фото. собрали нормально, ничего не скрипит, я довольна"],["Пермь","ТЦ Планета, шоссе Космонавтов, 162Б","2026-07-09",5,1,["Консультация (позитив)"],"Приехали вообще-то за матрасом, а уехали ещё и с подушками. Консультант нормально объяснил разницу, без навязывания. Первая ночь дома всё показала, спали как люди"],["Пермь","ТЦ Планета, шоссе Космонавтов, 162Б","2026-08-06",5,1,["Качество товара / брак","Цены, акции, оплата"],"Заехала за пледом, а уехала с пледом и подушками на диван. Ну потому что сложно уйти, когда и качество нравится, и акции приятные, и плед с подушками сочетается идеально"],["Пермь","ТЦ Планета, шоссе Космонавтов, 162Б","2026-08-13",5,1,[],"Купила подушку, потому что старая уже совсем износилась. Сплю несколько ночей на новой, пока ощущения очень хорошие. Хотя первую ночь надо было привыкнуть, но! К хорошему долго привыкать не приходится"],["Пермь","ТЦ Планета, шоссе Космонавтов, 162Б","2026-10-01",5,1,["Атмосфера и салон"],"Отличный профессиональный состав сотрудников! Выбрали и приобрели супер матрас линейки Serta Denver! Несколькими днями позже прикупили шикарное одеяло Infinity (нежное облако с хрустом, как в отеле)). Особое спасибо за помощь в выборе"],["Пермь","ТЦ Планета, шоссе Космонавтов, 162Б","2026-10-17",1,1,["Доставка и сроки","Гарантия, возврат, претензии","Сборка"],"Здравствуйте. Хотел бы вкратце описать свою ситуацию. В июле 2026 года заказали диван и кровать, заказ пришел с задержкой почти в месяц! Но тут вопрос отпал, так как выплатили неустойку! Вопрос и претензия в другом. Приехали сборщики"],["Самара","ТЦ Эль Рио, Московское шоссе, 205","2024-08-01",1,1,["Качество товара / брак"],"Отвратительная ткань для дивана, за 2 недели использования превратилась в 2 летний диван. Кошек и собак нет, использовался диван по назначению, даже не спали на нем, дневное использование, ткань и трепалась и покрылась катышками."],["Самара","ТЦ Эль Рио, Московское шоссе, 205","2024-12-07",5,0,["Качество товара / брак"],"Качество 🔥"],["Самара","ТЦ Эль Рио, Московское шоссе, 205","2024-12-14",5,1,["Доставка и сроки","Гарантия, возврат, претензии"],"Купила диван и осталась довольна. Он очень удобный, доставка также порадовала, вежливый персонал, молодцы. Обязательно вернусь за новыми подушками."],["Самара","ТЦ Эль Рио, Московское шоссе, 205","2025-01-01",5,1,["Консультация (позитив)"],"Спасибо за моё самое удобное кресло. Продавец мне его когда показывал сказал, что будет очень удобно, я как-то фразу всерьёз не воспринял, а сейчас понимаю, что имелось в виду. Поверьте, в восторге не только спина)))"],["Самара","ТЦ Эль Рио, Московское шоссе, 205","2025-01-03",5,1,["Гарантия, возврат, претензии","Атмосфера и салон"],"Заходила на днях в этот магазин за одеялом, понравилось. Выбор просто потрясающий! Обязательно вернусь за матрасом."],["Самара","ТЦ Эль Рио, Московское шоссе, 205","2025-09-30",5,1,["Доставка и сроки","Цены, акции, оплата","Консультация (позитив)","Атмосфера и салон"],"Отличный выбор, матрасы помогли подобрать идеальный по жесткости и цене. Привезли точно в срок прямо в квартиру, покупали 2 матраса и обоими довольны!"],["Самара","ТЦ Эль Рио, Московское шоссе, 205","2025-11-13",5,1,[],"После написания отзыва мне заменили матрас! Спасибо"],["Самара","ТЦ Эль Рио, Московское шоссе, 205","2025-12-30",1,1,["Доставка и сроки","Связь и поддержка"],"Отвратительная работа с клиентом. Заказ перенесли сначала на неделю, в заявленный срок вообще не отзвонились и не предупредили, что он еще не укомплектован до клнца и лежит на складе в другом городе. Пришлось по несколько раз ходи"],["Самара","ТЦ Эль Рио, Московское шоссе, 205","2026-02-21",5,1,["Связь и поддержка","Консультация (позитив)"],"Хочу поблагодарить сотрудников магазина Askona. Первый диван мы с мужем заказали в ноябре 2025г. В салоне нас консультировала и оформляла заказ менеджер. Работает с душой, профессионально, доброжелательно."],["Самара","ТЦ Эль Рио, Московское шоссе, 205","2026-04-02",1,1,["Качество товара / брак","Гарантия, возврат, претензии"],"Разочарована в данной организации! Матрасу нет и года, а швы разошлись! Покупая не дешовую мебель надеешься на качество и на гарантию. По итогу Аскона не разбирается вовсе и не даёт официальных ответов! По фото определяет как испо"],["Самара","ТЦ Эль Рио, Московское шоссе, 205","2026-09-15",5,1,["Качество товара / брак"],"Подушка просто находка. Такая мелочь вроде бы, а качество сна поменялось очень заметно. Девочки, подушки с эффектом памяти - это тема, я про отеки забыла!"],["Самара","ТЦ Эль Рио, Московское шоссе, 205","2026-10-04",5,1,["Связь и поддержка","Консультация (позитив)","Атмосфера и салон"],"Купила матрас в данном магазине \"Аскона\". Что хочу сказать, магазин понравился, чистый, уютный, консультанты приветливые и профессионалы своего дела. Очень понравилось работать с консультантом, учла все мои потребности к выб"],["Самара","ТЦ Эль Рио, Московское шоссе, 205","2026-10-04",5,1,["Консультация (позитив)"],"Хороший магазин. Профессиональные консультанты. Подобрали все под ключ от кровати до постельного белья. Раньше были проблемы со спиной, сейчас споровый сон без боли"],["Самара","ТЦ Эль Рио, Московское шоссе, 205","2026-10-05",5,1,["Консультация (позитив)","Атмосфера и салон"],"Пришла поупать матрас очнь большой выбор , спасибо консультанту за пофесссиональную помощь в выборе я осталась очень довльна, теперь всем своим родственикам и знакомым буду рекомендовать"],["Самара","ТЦ Эль Рио, Московское шоссе, 205","2026-10-05",5,1,["Доставка и сроки","Связь и поддержка","Наличие и комплектность заказа","Консультация (позитив)","Атмосфера и салон"],"Нужен был срочно диван для сна. Спасибо девушкам, которые там работают помогли выбрать диван из наличия, и организовали доставку быстро. Вообще атмосфера теплая и уютная. Диван отлично вписался"],["Самара","ТЦ Эль Рио, Московское шоссе, 205","2026-10-07",5,1,["Цены, акции, оплата"],"Шикарный магазин. Большая благодарность сотруднику. Пришла только за матрасом, в итоге купила кровать, матрас, постельное белье и шикарные подушки. Спасибо что есть рассрочка. Пользуюсь меньше месяца, но я в восторге."],["Самара","ТЦ Эль Рио, Московское шоссе, 205","2026-10-09",5,1,["Консультация (позитив)"],"Зашла в этот салон,посмотреть матрас для себя, т.к. хочу поменять старый. Меня у входа встретили приветливые девушки. Всё рассказали и показали о преимуществах. Буду думать о покупке и приду совершить её только сюда."],["Самара","ТЦ Эль Рио, Московское шоссе, 205","2026-10-11",5,1,["Связь и поддержка","Консультация (позитив)"],"Очень хороший магазин! Отдельно хочу отметить профессиональную и грамотную работу консультанта. Помогла подобрать нам диван,кровать,матрас . Матрас не подошёл, всё решили и поменяли. Сервис на высоте. Молодцы!!! Будем ещё пок"],["Самара","ТЦ Эль Рио, Московское шоссе, 205","2026-10-18",5,1,["Доставка и сроки","Консультация (позитив)"],"Спасибо за кровать с подъёмным механизмом. Смотрел, чтобы и внешне нормально выглядела, и в использовании была удобная. Мне буквально всё показали, рассказали по материалам, как открывается, как ухаживать. Привезли без задержек"],["Самара","ТЦ Эль Рио, Московское шоссе, 205","2026-10-21",5,1,["Доставка и сроки","Консультация (позитив)"],"Отдельно хочется сказать спасибо за терпение. Мы правда долго выбирали матрас, задавали кучу вопросов, сомневались между несколькими вариантами. На все продавцы отвечали спокойно, без раздражения и главное понятно. Привезли в срок"],["Санкт-Петербург","Мебельный Континент, Варшавская улица, 3 к1","2020-11-05",1,1,["Доставка и сроки","Связь и поддержка"],"Магазин нормальный! А вот доставка накосячила. Позвонили предварительно, сказали ждать.... человек не пошёл на работу, сидел дома ждал матрас... и что вы думаете? Матрас на складе потеряли!!! Потеряли!!! Матрас огромный!!! Как его можно потерять???! Ни со склада, ни из сервиса, никто не удосужился п"],["Санкт-Петербург","Мебельный Континент, Варшавская улица, 3 к1","2022-11-05",5,1,[],"Доброжелательные сотрудники, заказа быстро нашли, предложили протестировать сразу на месте, все на высшем уровне!"],["Санкт-Петербург","Мебельный Континент, Варшавская улица, 3 к1","2024-01-12",1,1,["Доставка и сроки","Связь и поддержка"],"Отвратительная доставка! Выбираешь вечерний интервал, доставщик звонит и просит приехать в час, так как у них такой график, что раньше приедут. В итоге, я ухожу с работы и что вы думаете? Доставщик только и делают, что выпаривают, что будут через 20 минут. В результате, можно было не приезжать!"],["Санкт-Пете  центр, Невский проспект, 114-116","2026-06-18",5,1,["Консультация (позитив)"],"Я из тех, кто сначала читает отзывы, потом думает, потом еще раз читает отзывы. И все равно боится. Тут вживую всё увидел, стало спокойнее, консультанты не суетные, мебель нормальная, обстановка тоже. Лайк от души"],["Санкт-Петербург","ТК Невский центр, Невский проспект, 114-116","2026-07-10",5,1,["Качество товара / брак"],"Не первый раз была в асконе, и пока без разочарований. Что матрас, что бельё, что подушки, всё хорошего качества. Я так скажу, когда находишь “свой” магазин, уже особо никуда и не тянет"],["Санкт-Петербург","ТК Невский центр, Невский проспект, 114-116","2026-07-15",5,1,["Доставка и сроки"],"Диван понравился ещё на сайте, вживую оказался даже лучше. Цвет прям наш, как и искали. Доставка вовремя, без неприятных сюрпризов"],["Санкт-Петербург","ТК Невский центр, Невский проспект, 114-116","2026-08-07",5,1,[],"Брали анатомические подушки себе и мужу, сначала сомневались, но после первой же ночи поняли, что не зря купили. Очень комфортная вещь!"],["Санкт-Петербург","ТК Невский центр, Невский проспект, 114-116","2026-08-14",5,1,["Доставка и сроки","Связь и поддержка"],"Диван выбирали долго, потому что хотели и красивый, и удобный. Здесь нашли именно такой вариант, который устроил по всем пунктам. И самое приятное это механизм раскладывания, которые работает плавно, тихо, супер! Я очень довольна и муж тоже!"],["Санкт-Петербург","ТК Невский центр, Невский проспект, 114-116","2026-09-02",1,1,["Доставка и сроки","Качество товара / брак","Гарантия, возврат, претензии"],"Не доставили кровать Месяц ожидания свыше назначенного времени Неустойку платить отказываются Есть более качественные и клиентоорентированные бренды, но точно не Аскона"],["Санкт-Петербург","ТК Невский центр, Невский проспект, 114-116","2026-10-01",1,1,["Качество товара / брак","Гарантия, возврат, претензии","Связь и поддержка","Грубость / невнимание персонала"],"Никогда не покупайте мебель в Асконе и не берите се const dshort = d => d.toLocaleDateString("ru-RU",{day:"numeric",month:"short"});

function scoreBadge(v, good=75, warn=60, txt){ return `<span class="score ${lvl(v,good,warn)}">${txt!=null?txt:fmt(v)}</span>`; }
function stars(n){ let s=""; for(let i=1;i<=5;i++) s += i<=n ? "★" : '<span class="off">★</span>'; return `<span class="stars" aria-label="${n} из 5">${s}</span>`; }

/* ---------- salons ---------- */
const S = D.salons.map((s,i) => {
  const r = rng(1000+i*7);
  const fresh = s.n26 ? s.neg26/s.n26 : s.neg/s.n;
  const base = 1 - fresh;
  const qrCsat = clamp(3.55 + base*1.25 + (r()-.5)*.35, 3.1, 4.9);
  const qrNps = Math.round(clamp(-15 + base*85 + (r()-.5)*16, -35, 82));
  const qrN = Math.round(40 + r()*180);
  const fr = FRANCHISE.has(i);
  const tp = Math.round(clamp(58 + base*36 + (r()-.5)*14 - (fr?11:0), 48, 98));
  const post = Math.round(clamp(40 + base*48 + (r()-.5)*12 - (fr?6:0), 30, 96));
  const revScore = clamp(Math.round((s.rating-3)/2*45 + (1-fresh)*55), 0, 100);
  const idx = Math.round(.30*revScore + .25*((qrCsat-1)/4*100) + .25*tp + .20*post);
  const hist = []; let v = idx + Math.round((r()-.4)*10);
  for(let w=0; w<8; w++){ hist.push(clamp(Math.round(v),20,99)); v += (idx - v)/(8-w) + (r()-.5)*4; }
  hist[7] = idx;
  return { id:i, ...s, short:SHORT[i], region:REGION[s.city]||"—", format: FRANCHISE.has(i)?"Франшиза":"Собственная",
    fresh, qrCsat, qrNps, qrN, tp, post, revScore, idx, hist, hidden: s.rating>=4 && fresh>=.3 };
});
const byAddr = {}; S.forEach(s => byAddr[s.addr] = s);

/* five-star waves: ≥3 пятёрок в один день */
const WAVES = [];
S.forEach(s => { const c = {}; (s.reviews||[]).forEach(r => { if(r.stars===5 && r.date){ const k=r.date.toISOString().slice(0,10); c[k]=(c[k]||0)+1; } });
  Object.entries(c).forEach(([k,n]) => { if(n>=3) WAVES.push({salon:s, date:new Date(k+"T12:00:00"), n}); }); });
WAVES.sort((a,b)=>b.date-a.date);

/* spikes: ≥2 негативных отзыва по одной теме за 120 дней в одном салоне */
const SPIKES = [];
S.forEach(s => { const c = {}; (s.reviews||[]).forEach(r => { if(r.tone==="neg" && r.date && (TODAY-r.date)/DAY<=120) r.themes.forEach(t => { (c[t]=c[t]||[]).push(r); }); });
  Object.entries(c).forEach(([t,a]) => { if(a.length>=2) SPIKES.push({salon:s, theme:t, n:a.length, last:new Date(Math.max(...a.map(x=>x.date))), reviews:a}); }); });
SPIKES.sort((a,b)=>b.n-a.n || b.last-a.last);

/* ---------- charts ---------- */
function niceAxis(lo, hi, floorZero){
  if(floorZero) lo = 0;
  const raw = Math.max((hi-lo)/4, 1e-9), p = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1,2,2.5,5,10].map(m=>m*p).find(s=>s>=raw);
  const mn = Math.floor(lo/step)*step; let mx = mn + step*4; while(mx < hi) mx += step;
  return {mn, mx, step};
}
function barList(items, opt={}){
  const max = opt.max || Math.max(...items.map(i=>i.v), 1);
  return `<div class="bars">${items.map(i => `<div class="bar${i.act?" clk":""}" ${i.act||""} data-tip="${esc(i.tip || (i.l + ": " + (opt.fmt?opt.fmt(i.v):fmt(i.v))))}"><span class="lbl" title="${esc(i.l)}">${esc(i.l)}</span><span class="t"><i style="width:${clamp(i.v/max*100,0,100)}%;background:${i.c||"var(--accent)"}"></i></span><span class="v">${opt.fmt?opt.fmt(i.v):fmt(i.v)}</span></div>`).join("")}</div>`;
}
function spark(vals, w=90, h=26){
  const mn = Math.min(...vals)-2, mx = Math.max(...vals)+2;
  const pts = vals.map((v,i)=>[i/(vals.length-1)*(w-6)+3, h-3-(v-mn)/(mx-mn)*(h-6)]);
  const up = vals[vals.length-1] >= vals[0];
  const c = up ? "var(--good)" : "var(--crit)";
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(p=>p.join(",")).join(" ")}"/><circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="3" fill="${c}"/></svg>`;
}
function lineChart(series, labels, opt={}){
  const W=640, H=opt.h||220, L=34, Rr=24, T=12, B=26;
  const all = series.flatMap(s=>s.v); const ax = niceAxis(opt.min!=null?opt.min:Math.min(...all)-2, Math.max(...all)+1, opt.min===0); let mn = ax.mn, mx = ax.mx;
  const x = i => L + i/(labels.length-1)*(W-L-Rr), y = v => T + (1-(v-mn)/(mx-mn))*(H-T-B);
  let g = ""; const step = ax.step;
  for(let v=mn; v<=mx+1e-9; v+=step){ g += `<line class="grid-l" x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${fmt(v)}</text>`; }
  labels.forEach((l,i)=>{ g += `<text x="${x(i)}" y="${H-8}" text-anchor="middle">${esc(l)}</text>`; });
  series.forEach(s => {
    const d = s.v.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
    if(s.area) g += `<path d="${d}L${x(s.v.length-1)},${y(mn)}L${x(0)},${y(mn)}Z" fill="${s.c}" opacity=".10"/>`;
    g += `<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const li = s.v.length-1; g += `<circle cx="${x(li)}" cy="${y(s.v[li])}" r="4" fill="${s.c}" stroke="var(--surface)" stroke-width="2"/>`;
  });
  labels.forEach((l,i)=>{ const tip = esc(l + " — " + series.map(s=>s.nm+": "+fmt(s.v[i])).join(" · ")); g += `<rect x="${x(i)-(W-L-Rr)/(labels.length-1)/2}" y="${T}" width="${(W-L-Rr)/(labels.length-1)}" height="${H-T-B}" fill="transparent" data-tip="${tip}"/>`; });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(opt.label||"График")}">${g}</svg>`;
}
function donut(v, max=100, c="var(--accent)", label=""){
  const r=34, C=2*Math.PI*r, f=clamp(v/max,0,1);
  return `<svg width="92" height="92" viewBox="0 0 92 92" role="img" aria-label="${esc(label)}"><circle cx="46" cy="46" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="10"/><circle cx="46" cy="46" r="${r}" fill="none" stroke="${c}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*f} ${C}" transform="rotate(-90 46 46)"/><text x="46" y="51" text-anchor="middle" style="fill:var(--ink);font-size:18px;font-weight:650">${esc(label)}</text></svg>`;
}

function revFiltered(){
  const f = st.rev; let a = R.filter(r=>inScope(r.salon));
  if(f.salon!=="all") a = a.filter(r=>r.salon.id===+f.salon);
  if(f.tone!=="all") a = a.filter(r=>r.tone===f.tone);
  if(f.theme!=="all") a = a.filter(r=>r.themes.includes(f.theme));
  if(f.resp!=="all") a = a.filter(r=> f.resp==="yes" ? (r.resp||r.reply) : !(r.resp||r.reply));
  if(f.year!=="all") a = a.filter(r=>r.date && r.date.getFullYear()===+f.year);
  if(f.q) { const q = f.q.toLowerCase(); a = a.filter(r=>r.text.toLowerCase().includes(q)); }
  return a.sort((x,y)=>(y.date||0)-(x.date||0));
}

/* ---------- predictive ---------- */
function slope(a){ const n=a.length, mx=(n-1)/2, my=avg(a); let num=0,den=0; a.forEach((v,i)=>{num+=(i-mx)*(v-my); den+=(i-mx)**2;}); return num/den; }
function predictChart(hist, fc, labels){
  const W=640, H=230, L=34, Rr=24, T=12, B=26; const all=[...hist,...fc.map(f=>f.hi),...fc.map(f=>f.lo)];
  const ax=niceAxis(Math.min(...all)-1, Math.max(...all)+1), mn=ax.mn, mx=ax.mx; const n=hist.length+fc.length;
  const x=i=>L+i/(n-1)*(W-L-Rr), y=v=>T+(1-(v-mn)/(mx-mn))*(H-T-B); let g="";
  for(let v=mn; v<=mx+1e-9; v+=ax.step){ g+=`<line class="grid-l" x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${fmt(v)}</text>`; }
  labels.forEach((l,i)=>{ if(i%2===0||i===n-1) g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${esc(l)}</text>`; });
  const h0=hist.length-1;
  const band = `M${x(h0)},${y(hist[h0])}` + fc.map((f,i)=>`L${x(h0+1+i)},${y(f.hi)}`).join("") + fc.slice().reverse().map((f,i)=>`L${x(n-1-i)},${y(f.lo)}`).join("") + "Z";
  g += `<path d="${band}" fill="var(--accent)" opacity=".12"/>`;
  g += `<path d="${hist.map((v,i)=>`${i?"L":"M"}${x(i)},${y(v)}`).join("")}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>`;
  g += `<path d="M${x(h0)},${y(hist[h0])}${fc.map((f,i)=>`L${x(h0+1+i)},${y(f.v)}`).join("")}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 4"/>`;
  g += `<line x1="${x(h0)}" x2="${x(h0)}" y1="${T}" y2="${H-B}" stroke="var(--line)" stroke-dasharray="2 3"/><text x="${x(h0)+4}" y="${T+10}">сегодня</text>`;
  g += `<circle cx="${x(h0)}" cy="${y(hist[h0])}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`;
  labels.forEach((l,i)=>{ const v = i<=h0 ? `факт ${fmt(hist[i])}` : `прогноз ${fmt(fc[i-h0-1].v)} (${fmt(fc[i-h0-1].lo)}–${fmt(fc[i-h0-1].hi)})`; g+=`<rect x="${x(i)-(W-L-Rr)/(n-1)/2}" y="${T}" width="${(W-L-Rr)/(n-1)}" height="${H-T-B}" fill="transparent" data-tip="${esc(l+": "+v)}"/>`; });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Прогноз индекса">${g}</svg>`;
}
function salonForecast(s){
  const k = slope(s.hist); const fc4 = clamp(Math.round(s.idx + k*4), 20, 99);
  const prob = Math.round(100/(1+Math.exp((fc4-60)/4)));
  const f = []; if(s.fresh>=.3) f.push("Свежий негатив в отзывах"); if(k<-.4) f.push("Индекс падает"); if(s.post<65) f.push("Слабо после оплаты"); if(s.tp<70) f.push("Стандарт в салоне");
  const r26 = (s.reviews||[]).filter(r=>r.date&&r.date.getFullYear()===2026); const a26 = r26.length? avg(r26.map(r=>r.stars)) : s.rating;
  const nv = Math.round(s.votes*.25); const rf = (s.rating*s.votes + a26*nv)/(s.votes+nv);
  return {s, k, fc4, prob, f, a26, rf, n26:r26.length};
}
P.predict = () => {
  const sc = scope(); const F = sc.map(salonForecast);
  const hist = WEEKS.map((_,w)=>Math.round(avg(sc.map(s=>s.hist[w]))));
  const k = slope(hist); const fc = [1,2,3,4].map(i=>{ const v = Math.round(hist[7]+k*i); return {v, lo:v-2-i, hi:v+2+i}; });

  const al = ANS.filter(a=>a.alert && inScope(a.salon));
  const load = STAGES.map(sg=>{ const n = al.filter(a=>a.stage===sg.k).length; const recent = al.filter(a=>a.stage===sg.k && (TODAY-a.at)/DAY<=7).length; return {l:sg.nm, v: Math.max(0, Math.round(recent*1.1 + (recent-(n-recent))*.3))}; });
  const drop = F.filter(x=>x.rf < x.s.rating-.04).sort((a,b)=>(a.rf-a.s.rating)-(b.rf-b.s.rating));
  return `
  <div class="ph"><div><h1>Прогнозы</h1><p>Модель смотрит на тренд индекса, свежий негатив и опросы после оплаты и заранее показывает, какие точки уйдут в красную зону и где просядет рейтинг на картах.</p></div><span class="sp"></span>${SRC_DEMO}</div>
  <div class="kpis">
    <div class="kpi"><span class="l">Индекс сети через 4 недели</span><span class="v">${fc[3].v}<small> ± ${fc[3].hi-fc[3].v}</small></span><span class="d">сейчас ${hist[7]}</span></div>
    <button class="kpi link" data-act="scrollTo" data-to="#p-risk"><span class="l">Риск красной зоны</span><span class="v ${risk.length?"dn":""}">${risk.length}<small> точек</small></span><span class="d">вероятность от 30%</span></button>
    <div class="kpi"><span class="l">Алертов на следующей неделе</span><span class="v">${sum(load.map(l=>l.v))}</span><span class="d">больше всего — ${esc(load.slice().sort((a,b)=>b.v-a.v)[0].l.toLowerCase())}</span></div>
    <button class="kpi link" data-act="scrollTo" data-to="#p-rating"><span class="l">Рейтинг 2ГИС снизится</span><span class="v">${drop.length}<small> точек</small></span><span class="d">через 6 месяцев при текущем негативе</span></button>
  </div>
  <div class="grid g-2-1">
    <div class="card"><div class="card-h"><h2>Индекс сети: факт и прогноз</h2><span class="sp"></span><span class="legend"><span><i style="background:var(--accent)"></i>факт</span><span><i class="dash"></i>прогноз</span><span><i style="background:var(--accent);opacity:.25"></i>интервал</span></span></div>
      ${predictChart(hist, fc, [...WEEKS,"нед 45","нед 46","нед 47","нед 48"])}</div>
    <div class="card"><h2>Ожидаемые алерты по этапам</h2><div class="sub">следующая неделя</div>${barList(load.map(l=>({...l, c:"var(--accent)", act:`data-act="alStatusGo" data-st="${STAGES.find(s=>s.nm===l.l).k}"`, tip:`${l.l}: ожидается ${l.v} алертов · клик — текущие алерты этапа`})))}
      <div class="ins"><span class="ic acc">i</span><span>Совет: поставьте дополнительную смену в логистике на этапы с ростом — так SLA 4 часа не будет нарушен.</span></div></div>
  </div>
  <div class="card" id="p-risk"><div class="card-h"><h2>Риск ухода в красную зону</h2><span class="sp"></span><span class="small muted">индекс &lt; 60 через 4 недели</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>Точка</th><th class="r">Сейчас</th><th>Тренд</th><th class="r">Через 4 нед</th><th style="min-width:160px">Вероятность</th><th>Что влияет</th><th></th></tr></thead><tbody>
    ${(risk.length?risk:F.sort((a,b)=>b.prob-a.prob).slice(0,5)).map(x=>`<tr><td><b>${esc(x.s.short)}</b></td><td class="r">${scoreBadge(x.s.idx)}</td><td>${spark(x.s.hist)}</td><td class="r">${scoreBadge(x.fc4)}</td><td><div class="row" style="flex-wrap:nowrap"><span class="t" style="flex:1;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;display:block"><i style="display:block;height:100%;width:${x.prob}%;background:var(--${x.prob>=60?"crit":x.prob>=30?"warn":"good"})"></i></span><b class="num">${x.prob}%</b></div></td><td class="small">${x.f.map(f=>`<span class="chip">${esc(f)}</span>`).join(" ")||"—"}</td><td><button class="btn sm" data-salon="${x.s.id}">Карточка</button></td></tr>`).join("")}
    </tbody></table></div></div>
  <div class="card" id="p-rating"><div class="card-h"><h2>Прогноз рейтинга 2ГИС через 6 месяцев</h2></div><div class="sub">Если новые оценки будут такими же, как в отзывах 2026 года, и их придёт ещё около четверти от накопленных</div>
    <div class="tbl-wrap"><table><thead><tr><th>Салон</th><th class="r">Рейтинг сейчас</th><th class="r">Средняя оценка в 2026</th><th class="r">Прогноз</th><th class="r">Изменение</th></tr></thead><tbody>
    ${F.filter(x=>x.n26>=5).sort((a,b)=>(a.rf-a.s.rating)-(b.rf-b.s.rating)).slice(0,10).map(x=>{ const d = x.rf-x.s.rating; return `<tr class="click" data-salon="${x.s.id}"><td>${esc(x.s.short)}</td><td class="r num">${fmt(x.s.rating,1)}</td><td class="r num">${fmt(x.a26,2)} <span class="muted small">(${x.n26})</span></td><td class="r num"><b>${fmt(x.rf,2)}</b></td><td class="r num ${d<-.04?"dn":d>.04?"up":""}">${d>0?"+":d<0?"−":""}${fmt(Math.abs(d),2)}</td></tr>`; }).join("")}
    </tbody></table></div>
    <div class="small muted">Рейтинг и оценки 2026 — из 2ГИС; число будущих оценок — допущение модели.</div></div>`;
};

  let g = [...groupBy(rows, D1)].map(([k,a]) => ({k, v:M.agg(a), n:a.length, a}));
  if(D1.ord) g.sort((x,y)=>D1.ord(x.a[0])-D1.ord(y.a[0]));
  else if(w.sort==="asc") g.sort((x,y)=>x.v-y.v);

    if(D2.ord) keys2.sort((x,y)=>D2.ord(x.a[0])-D2.ord(y.a[0])); else keys2.sort((x,y)=>y.v-x.v);
    keys2 = keys2.slice(0, w.type==="heat"||w.type==="table" ? 10 : 6);

function rPie(w, c){

/* global search */
function searchResults(q){
  q = q.trim().toLowerCase(); if(q.length<2) return "";
  const pages = Object.entries(TITLES).filter(([k,t])=>allowed(k) && t.toLowerCase().includes(q)).slice(0,4);
  const sal = scope().filter(s=>(s.short+" "+s.addr+" "+s.city).toLowerCase().includes(q)).slice(0,5);
  const al = ANS.filter(a=>inScope(a.salon) && (String(a.id).includes(q) || a.comment.toLowerCase().includes(q))).slice(0,4);
  const rv = R.filter(r=>inScope(r.salon) && r.text.toLowerCase().includes(q));
  const blk = (t, items) => items.length ? `<div class="sg"><div class="sgh">${t}</div>${items.join("")}</div>` : "";
  const html = blk("Разделы", pages.map(([k,t])=>`<a class="sr" href="#${k}">${esc(t)}<span>${esc(MOD_OF[k].nm)}</span></a>`))
    + blk("Салоны", sal.map(s=>`<button class="sr" data-act="salonOpen" data-id="${s.id}">${esc(s.short)}<span>индекс ${s.idx} · 2ГИС ${fmt(s.rating,1)}</span></button>`))
    + blk("Анкеты", al.map(a=>`<button class="sr" data-alert="${a.id}">#${a.id} · ${esc(a.salon.short)}<span>${esc(a.comment)}</span></button>`))
    + blk("Клиенты", CLIENTS.filter(c=>inScope(c.salon) && (c.name+" "+c.orders.map(o=>o.no).join(" ")).toLowerCase().includes(q)).slice(0,4).map(c=>`<button class="sr" data-act="clientOpen" data-id="${c.id}">${esc(c.name)}<span>${esc(c.salon.short)} · ${c.seg} · ${c.orders[0].no}</span></button>`))
    + (rv.length ? blk("Отзывы", [`<button class="sr" data-act="revSearch" data-q="${esc(q)}">Найти «${esc(q)}» в отзывах<span>${rv.length} совпадений</span></button>`]) : "");
  return html || `<div class="sg"><div class="empty small">Ничего не найдено</div></div>`;
}

const CLIENTS = [];
(function(){
  const r = rng(4242);
  ANS.slice().reverse().forEach(a => {
    let c = CLIENTS.length && r()<.22 ? CLIENTS.find(x=>x.salon===a.salon) : null;
    if(!c){ c = {id:CLIENTS.length+1, name:a.name, phone:a.phone || "+7 9" + Math.floor(10+r()*89) + " •••-••-" + Math.floor(10+r()*89), salon:a.salon, orders:[], answers:[], review:null, ch:pick(r,["SMS","WhatsApp","Telegram","Email"])}; CLIENTS.push(c); }
    c.answers.push(a); a.client = c;
  });
  CLIENTS.forEach(c => {
    const n = 1 + (r()<.3?1:0);
    for(let i=0;i<n;i++){ const m = pick(r, MODELS); c.orders.push({no: i===0 ? c.answers[0].order : "AS-"+Math.floor(1e6+r()*8e6), date:new Date(+c.answers[0].at - (5+r()*(i?400:20))*DAY), item:m[0], sum:m[1]}); }

    c.ltv = sum(c.orders.map(o=>o.sum));
    c.open = c.answers.some(a=>a.alert && a.status!=="closed");

  });
})();

P.texts = () => {
  const a = ANS.filter(x=>inScope(x.salon));
  const th = [...new Set(a.flatMap(x=>x.ctheme))].map(t=>{ const w = a.filter(x=>x.ctheme.includes(t)); return {t, n:w.length, neg:w.filter(x=>x.alert).length, nps:w.length?Math.round((w.filter(x=>x.nps>=9).length-w.filter(x=>x.nps<=6).length)/w.length*100):0}; }).sort((x,y)=>y.neg-x.neg);
  const wk = a.filter(x=>(TODAY-x.at)/DAY<=7), pw = a.filter(x=>(TODAY-x.at)/DAY>7);
  const growth = th.map(x=>({t:x.t, now:wk.filter(y=>y.alert&&y.ctheme.includes(x.t)).length, prev:pw.filter(y=>y.alert&&y.ctheme.includes(x.t)).length})).filter(x=>x.now>x.prev).sort((x,y)=>(y.now-y.prev)-(x.now-x.prev));
  return `

    <div class="card"><div class="card-h"><h2>Темы в комментариях с низкой оценкой</h2></div><div class="sub">клик — все комментарии по теме</div>${barList(th.filter(x=>x.neg).map(x=>({l:x.t, v:x.neg, c:"var(--crit)", act:`data-act="ctheme" data-t="${esc(x.t)}"`, tip:`${x.t}: ${x.neg} негативных из ${x.n} · NPS темы ${x.nps}`})))}</div>
    <div class="card"><div class="card-h"><h2>Растёт за неделю</h2></div>${growth.length?`<div class="list">${growth.map(g=>`<div class="li"><span class="ic crit">↑</span><div class="b"><b>${esc(g.t)}</b><span>${g.now} за последние 7 дней · было ${g.prev}</span></div><button class="btn sm" data-act="ctheme" data-t="${esc(g.t)}">Открыть</button></div>`).join("")}</div>`:'<div class="empty">Роста нет</div>'}</div>

};

  const t = k => sum(rows.map(x=>x[k]));
  return `

  <div class="grid g-1-2">

      <div class="ctl"><label>Площадки</label><div class="row">${Object.entries(COLLECT.plat).map(([k,v])=>`<button class="chip${v?" pos":""}" data-act="colPlat" data-k="${esc(k)}">${v?"✓ ":""}${esc(k)}</button>`).join("")}</div></div>
      <div class="small muted">Отправка ${COLLECT.delay}, в канале, который клиент выбрал для анкеты.</div></div>
    <div class="card"><h2>Воронка за 30 дней</h2>${barList([["Промоутеров",t("prom")],["Приглашено",t("inv")],["Перешли на карты",t("cl")],["Оставили отзыв",t("post")]].map(([l,v])=>({l,v})),{max:Math.max(1,t("prom"))})}
      <div class="ins"><span class="ic">i</span><span>${t("post")} новых отзывов 4–5★ за месяц. По модели прогноза это поднимет средний рейтинг сети в 2ГИС примерно на 0,1 за квартал.</span></div></div>
  </div>
  <div class="card"><div class="card-h"><h2>По салонам</h2></div><div class="tbl-wrap"><table><thead><tr><th>Салон</th><th class="r">Промоутеров</th><th class="r">Приглашено</th><th class="r">Перешли</th><th class="r">Отзывов</th><th class="r">Конверсия</th></tr></thead><tbody>${rows.sort((a,b)=>b.post-a.post).map(x=>`<tr class="click" data-salon="${x.s.id}"><td>${esc(x.s.short)}</td><td class="r num">${x.prom}</td><td class="r num">${x.inv}</td><td class="r num">${x.cl}</td><td class="r num"><b>${x.post}</b></td><td class="r num">${x.inv?pct(x.post/x.inv):"—"}</td></tr>`).join("")}</tbody></table></div></div>`;
};
S.forEach(s=>{ s.base2 = clamp((s.qrNps+20)/200, 0, .4); });

const RECS = [];
(function(){ S.forEach(s => { const nt = s.negThemes; const add = (txt, why, owner, eff, prio) => RECS.push({id:RECS.length, s, txt, why, owner, eff, prio, status:"Новая"});

  if((nt["Качество товара / брак"]||0)>=2) add("Проверить модели и партии из претензий, передать в качество производства", `${nt["Качество товара / брак"]} жалоб на брак`, "Качество производства", "−30% повторных претензий", "Высокий");

st.recF = "all";

  ${a.map(x=>`<tr><td><button class="lnk" data-salon="${x.s.id}">${esc(x.s.short)}</button></td><td><b>${esc(x.txt)}</b></td><td class="small ink2">${esc(x.why)}</td><td class="small">${esc(x.owner)}</td><td class="small">${esc(x.eff)}</td><td><span class="pill ${pr[x.prio]}">${x.prio}</span></td><td><select data-rec="${x.id}" aria-label="Статус">${["Новая","В работе","Выполнено"].map(s=>`<option${x.status===s?" selected":""}>${s}</option>`).join("")}</select></td></tr>`).join("") || '<tr><td colspan="7" class="empty">Нет рекомендаций</td></tr>'}
